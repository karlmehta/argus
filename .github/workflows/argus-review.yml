name: Argus Review v2

# Reusable workflow. A repo enables Argus by adding a thin caller
# (.github/workflows/argus.yml — see docs/configuration.md) that calls this with
# its Anthropic key. The model never uses tools; this runs a deterministic 1–2
# call pipeline (src/main.py): debounce → gate → delta → context pack → triage
# (Haiku) → review (Haiku|Sonnet) → merge → post. Verdict policy unchanged:
#   • request-changes — a confirmed blocker/major (per config.gate)
#   • comment         — default
#   • approve         — only if verdict.allow_approve AND zero blocker/major

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: .github/argus/config.yml
      harness-ref:
        description: "Ref of the Argus harness repo to run (pin a SHA/tag)."
        type: string
        required: true
      harness-repo:
        type: string
        default: xspan-ai/argus
    secrets:
      ARGUS_ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: argus-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Non-fork PR events, or an "@argus" command from a trusted non-bot author.
    if: >
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@argus') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Checkout Argus harness
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness-repo }}
          ref: ${{ inputs.harness-ref }}
          path: .argus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r .argus/requirements.txt

      - name: Argus
        working-directory: .argus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ARGUS_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ARGUS_CONFIG: ${{ inputs.config-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python -m src.main

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-run-${{ github.run_id }}
          path: argus-run.json
          if-no-files-found: ignore
