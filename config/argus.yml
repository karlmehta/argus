# Argus v2 configuration. Everything the reviewer's behavior depends on lives here,
# reviewable in a PR like any other change. A repo overrides this by committing its
# own .github/argus/config.yml.

version: 2

# Shadow mode (spec §9): run the full pipeline + write argus-run.json, but post
# nothing (no review, no comment). Use for 3 days in a new repo before going live.
dry_run: false

# Which review skills are eligible, in priority order. A skill is only LOADED on a
# given PR when its front-matter `always: true` or an `applies_to` glob matches a
# changed file (see skills/*.md) — this is the main fixed-prompt saving vs v1.
skills:
  - security
  - data-protection
  - correctness
  - concurrency
  - performance
  - api-compat
  - tests
  - observability
  - dependencies

# Models by stage. Haiku triages and does the default review; Sonnet only on
# high-risk deltas (or strict_globs). Omit review_high_risk to use Sonnet.
models:
  triage: claude-haiku-4-5
  review_default: claude-haiku-4-5
  review_high_risk: claude-sonnet-4-6

# Severity gate: lowest severity that forces "request changes". blocker|major|minor.
gate: major

verdict:
  # OFF by default — Argus never approves unless this is true AND there are no
  # blocker/major findings. See docs/governance.md.
  allow_approve: false
  never_approve_authors:
    - "dependabot[bot]"
    - "renovate[bot]"
    - "argus[bot]"

# Debounce: on a push (synchronize), wait this many minutes then check if a newer
# commit superseded this run — if so, exit before any model call.
debounce_minutes: 10

# Pipeline bounds.
max_changed_lines: 800      # above this: summary-only mode (1 Haiku call, no deep review)
context_lines: 30           # ± lines of HEAD context around each hunk
max_symbol_snippets: 20     # referenced-symbol signatures included
max_input_tokens: 60000     # hard pack ceiling; trims (announced) above this
max_inline_comments: 10     # extra findings roll into the summary table
min_confidence: 0.6         # drop findings below this (blockers always kept)

review_bots: false          # review PRs opened by bot accounts
strict_globs:               # force the high-risk (Sonnet) reviewer when any match
  - "**/auth/**"
  - "**/billing/**"
  - "**/payments/**"
  - "**/*permission*"
  - "**/*tenant*"
  - "**/*secret*"
  - "**/*.sql"
skip_globs: []              # appended to the built-in defaults (lockfiles, dist, images…)

budget:
  per_run_usd: 1.00         # abort before the review call if the estimate exceeds this
  per_pr_usd: 5.00          # cumulative across a PR's runs; then summary-only + ask a human
  per_repo_daily_usd: 40.00 # checked before any model call

# Back-compat: v1 `paths.skip` / `paths.strict` / `limits.max_inline_comments` are
# still honored if present.
